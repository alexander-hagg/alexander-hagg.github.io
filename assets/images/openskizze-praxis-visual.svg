<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Conceptual OpenSKIZZE-Praxis QGIS plugin interface with a climate-adaptive site plan and cold-air corridor.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10140d"/>
      <stop offset="0.6" stop-color="#0b0d09"/>
      <stop offset="1" stop-color="#0d1511"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151b10"/>
      <stop offset="1" stop-color="#0e120c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f3f1e8" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
    <pattern id="parcel" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#c9f26b" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="air" cx="0" cy="50%" r="75%">
      <stop offset="0" stop-color="#8fd8d2" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8fd8d2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <ellipse cx="430" cy="340" rx="430" ry="260" fill="url(#air)"/>

  <!-- map table -->
  <g transform="translate(58 76)">
    <rect width="760" height="526" rx="18" fill="#0c120d" stroke="#f3f1e8" stroke-opacity=".14"/>
    <text x="26" y="38" fill="#8f9386" font-family="Inconsolata, monospace" font-size="13" letter-spacing="2">SITE 07 / BONN-DRANSDORF</text>
    <text x="734" y="38" fill="#8fd8d2" text-anchor="end" font-family="Inconsolata, monospace" font-size="13" letter-spacing="2">COLD-AIR CORRIDOR</text>
    <line x1="24" y1="58" x2="736" y2="58" stroke="#f3f1e8" stroke-opacity=".12"/>

    <!-- river / water -->
    <path d="M28 430 C 150 380 220 460 330 420 S 560 360 700 400 L 736 412 L 736 500 L 28 500 Z" fill="#0f2c31" opacity=".9"/>
    <path d="M28 430 C 150 380 220 460 330 420 S 560 360 700 400 L 736 412" fill="none" stroke="#8fd8d2" stroke-opacity=".35" stroke-width="2"/>

    <!-- parcels / buildings -->
    <g fill="#171d14" stroke="#39432e" stroke-width="1.2">
      <rect x="70" y="104" width="116" height="78" rx="3"/>
      <rect x="198" y="104" width="86" height="78" rx="3"/>
      <rect x="296" y="104" width="122" height="78" rx="3"/>
      <rect x="70" y="196" width="86" height="96" rx="3"/>
      <rect x="168" y="196" width="116" height="96" rx="3"/>
      <rect x="296" y="196" width="86" height="96" rx="3"/>
      <rect x="442" y="104" width="130" height="120" rx="3"/>
      <rect x="584" y="104" width="126" height="78" rx="3"/>
      <rect x="442" y="238" width="130" height="88" rx="3"/>
      <rect x="584" y="196" width="126" height="130" rx="3"/>
    </g>
    <g fill="url(#parcel)" opacity=".9">
      <rect x="70" y="104" width="116" height="78" rx="3"/>
      <rect x="168" y="196" width="116" height="96" rx="3"/>
      <rect x="442" y="104" width="130" height="120" rx="3"/>
      <rect x="584" y="196" width="126" height="130" rx="3"/>
    </g>
    <!-- pitched roofs -->
    <g fill="#c9f26b" opacity=".24">
      <path d="M70 104 L128 84 L186 104 Z"/>
      <path d="M168 196 L226 176 L284 196 Z"/>
      <path d="M442 104 L507 82 L572 104 Z"/>
      <path d="M584 196 L647 176 L710 196 Z"/>
    </g>

    <!-- canopy -->
    <g fill="#3f7a52" opacity=".7">
      <circle cx="350" cy="330" r="24"/><circle cx="380" cy="350" r="18"/><circle cx="325" cy="360" r="16"/>
      <circle cx="610" cy="360" r="26"/><circle cx="646" cy="380" r="20"/><circle cx="580" cy="390" r="15"/>
      <circle cx="125" cy="345" r="20"/><circle cx="160" cy="365" r="16"/>
    </g>

    <!-- cold air flow -->
    <g fill="none" stroke="#8fd8d2" stroke-width="2.2" stroke-linecap="round" opacity=".85">
      <path d="M26 300 C 170 268 260 330 390 300 S 610 250 736 278"/>
      <path d="M26 330 C 160 300 280 360 410 330 S 620 290 736 312" opacity=".6"/>
      <path d="M26 270 C 180 242 300 300 430 270 S 640 230 736 250" opacity=".45"/>
    </g>
    <g fill="#8fd8d2" opacity=".9">
      <path d="M210 268 l-12 7 12 7z"/><path d="M500 286 l-12 7 12 7z"/><path d="M660 266 l-12 7 12 7z"/>
    </g>
    <text x="34" y="246" fill="#8fd8d2" font-family="Inconsolata, monospace" font-size="11" letter-spacing="2">NIGHT AIR</text>

    <!-- planning annotation -->
    <g filter="url(#glow)">
      <circle cx="510" cy="318" r="5" fill="#c9f26b"/>
    </g>
    <line x1="510" y1="318" x2="510" y2="280" stroke="#c9f26b" stroke-opacity=".4"/>
    <text x="522" y="278" fill="#c9f26b" font-family="Inconsolata, monospace" font-size="11" letter-spacing="1.5">BUILDING BLOCK</text>

    <!-- scale / north -->
    <g transform="translate(670 456)" fill="#8f9386" font-family="Inconsolata, monospace" font-size="10">
      <text x="0" y="0" letter-spacing="1">N</text>
      <path d="M4 8 L4 -18 M4 -18 L0 -10 M4 -18 L8 -10" fill="none" stroke="#8f9386" stroke-width="1"/>
      <line x1="-40" y1="28" x2="40" y2="28" stroke="#8f9386" stroke-width="1"/>
      <text x="-40" y="44">10 m</text>
    </g>
  </g>

  <!-- plugin panel -->
  <g transform="translate(856 92)">
    <rect width="286" height="470" rx="16" fill="url(#panel)" stroke="#f3f1e8" stroke-opacity=".16"/>
    <text x="22" y="32" fill="#c9f26b" font-family="Inconsolata, monospace" font-size="11" letter-spacing="2">QGIS · PLUGIN</text>
    <text x="22" y="60" fill="#f3f1e8" font-family="EB Garamond, Georgia, serif" font-size="26">OpenSKIZZE</text>
    <text x="22" y="82" fill="#f3f1e8" font-family="EB Garamond, Georgia, serif" font-size="26" font-style="italic">Praxis</text>
    <line x1="22" y1="98" x2="264" y2="98" stroke="#f3f1e8" stroke-opacity=".14"/>

    <text x="22" y="124" fill="#8f9386" font-family="Inconsolata, monospace" font-size="9" letter-spacing="1.5">LAYERS</text>
    <g font-family="Inter, sans-serif" font-size="12" fill="#cfd0c4">
      <circle cx="28" cy="144" r="3" fill="#c9f26b"/><text x="42" y="148">Buildings</text>
      <circle cx="28" cy="166" r="3" fill="#8fd8d2"/><text x="42" y="170">Cold-air flow</text>
      <circle cx="28" cy="188" r="3" fill="#3f7a52"/><text x="42" y="192">Canopy</text>
      <circle cx="28" cy="210" r="3" fill="#f3f1e8" fill-opacity=".5"/><text x="42" y="214">Bauleitplanung</text>
    </g>

    <text x="22" y="250" fill="#8f9386" font-family="Inconsolata, monospace" font-size="9" letter-spacing="1.5">DESIGN GOALS</text>
    <g font-family="Inconsolata, monospace" font-size="10" fill="#cfd0c4">
      <text x="22" y="272">homes</text><text x="264" y="272" text-anchor="end" fill="#c9f26b">90</text>
      <rect x="22" y="280" width="242" height="3" rx="1.5" fill="#f3f1e8" fill-opacity=".1"/>
      <rect x="22" y="280" width="190" height="3" rx="1.5" fill="#c9f26b"/>
      <text x="22" y="304">comfort</text><text x="264" y="304" text-anchor="end" fill="#8fd8d2">68%</text>
      <rect x="22" y="312" width="242" height="3" rx="1.5" fill="#f3f1e8" fill-opacity=".1"/>
      <rect x="22" y="312" width="164" height="3" rx="1.5" fill="#8fd8d2"/>
    </g>

    <rect x="22" y="344" width="242" height="44" rx="8" fill="#c9f26b"/>
    <text x="143" y="371" text-anchor="middle" fill="#101208" font-family="Inter, sans-serif" font-size="12" font-weight="600">Generate layouts</text>
    <text x="143" y="410" text-anchor="middle" fill="#8f9386" font-family="Inconsolata, monospace" font-size="9" letter-spacing="1">DBU · H-BRS · OSGEO</text>
    <line x1="22" y1="432" x2="264" y2="432" stroke="#f3f1e8" stroke-opacity=".1"/>
    <text x="22" y="452" fill="#8f9386" font-family="Inconsolata, monospace" font-size="9" letter-spacing="1">2026–2027</text>
  </g>
</svg>
