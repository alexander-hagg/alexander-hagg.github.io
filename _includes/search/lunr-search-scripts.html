{% include base_path %}
{% assign locale = include.locale | default: site.locale %}
{% assign lang = locale | slice: 0,2 | default: "en" %}
{% case lang %}
{% when "gr" %}
  {% assign lang = "gr" %}
{% else %}
  {% assign lang = "en" %}
{% endcase %}
<script src="{{ base_path }}/assets/js/lunr/lunr.min.js"></script>
<script src="{{ base_path }}/assets/js/lunr/lunr-store.js"></script>
<script src="{{ base_path }}/assets/js/lunr/lunr-{{ lang }}.js"></script>
